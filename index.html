<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>FitPlan Pro · Gestión completa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    

    <!--NUEVO-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>



    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- ============================================
             LOGIN
             ============================================ -->
            <!-- ============================================ -->
<!-- LOGIN / REGISTRO                             -->
<!-- ============================================ -->
<div id="loginContainer" class="login-container active">
    <!-- Tabs Login/Registro -->
    <div class="auth-tabs">
        <button class="auth-tab active" data-auth-tab="login">
            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>
        <button class="auth-tab" data-auth-tab="registro">
            <i class="fas fa-user-plus"></i> Crear Cuenta
        </button>
    </div>

    <!-- ==================== LOGIN ==================== -->
    <div id="authLogin" class="auth-panel active">
        <h2><i class="fas fa-lock"></i> Iniciar sesión</h2>
        
        <label>Email</label>
        <input type="email" id="loginUser" placeholder="tu-email@ejemplo.com">
        
        <label>Contraseña</label>
        <input type="password" id="loginPass" placeholder="Contraseña">
        
        <div id="loginError" class="login-error">Email o contraseña incorrectos</div>
        
        <button class="btn" id="btnLogin">
            <i class="fas fa-sign-in-alt"></i> Ingresar
        </button>
        
        <div class="login-hint">
            <p>
                <a href="#" id="btnOlvidePassword" style="color:#3498db;text-decoration:none;">
                    <i class="fas fa-key"></i> ¿Olvidaste tu contraseña?
                </a>
            </p>
        </div>
    </div>

    <!-- ==================== REGISTRO ==================== -->
    <div id="authRegistro" class="auth-panel">
        <h2><i class="fas fa-user-plus"></i> Crear cuenta de cliente</h2>
        
        <label>Nombre completo</label>
        <input type="text" id="regNombre" placeholder="Juan Pérez">
        
        <label>RUT</label>
        <input type="text" id="regRut" placeholder="12.345.678-9">
        
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="tu-email@ejemplo.com">
        
        <label>Contraseña</label>
        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres">
        
        <label>Confirmar contraseña</label>
        <input type="password" id="regPassword2" placeholder="Repite la contraseña">
        
        <div id="registroError" class="login-error"></div>
        <div id="registroExito" class="login-success" style="display:none;"></div>
        
        <button class="btn btn-success" id="btnRegistrar" style="width:100%;margin-top:1rem;">
            <i class="fas fa-user-plus"></i> Crear Cuenta
        </button>
        
        <div class="login-hint">
            <p style="font-size:0.75rem;">
                Al crear tu cuenta podrás acceder a tu plan personalizado.
            </p>
        </div>
    </div>
</div>








        <!-- ============================================
             CONTENIDO PRINCIPAL
             ============================================ -->
        <div id="mainContent" style="display:none;">
            <!-- Info de usuario -->
            <div class="user-info">
                <span><i class="fas fa-user"></i> <span id="userNameDisplay">-</span></span>
                <span class="rol-badge" id="userRolBadge">-</span>
                <button class="btn btn-logout" id="btnLogout"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
            </div>

            <!-- Tabs (se generan dinámicamente) -->
            <div class="tabs" id="tabsContainer"></div>

            <!-- Contenido dinámico (se genera desde JS) -->
            <div id="tabContentContainer"></div>
        </div>
    </div>

    <!-- Modales -->
    <div id="modalDetalleCliente" class="modal-boleta" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content" style="max-width:700px;">
            <h3 style="color:#1d5a7a;margin-bottom:1rem;"><i class="fas fa-user-circle"></i> Detalle del Cliente</h3>
            <div id="modalDetalleClienteContenido"></div>
            <button class="btn btn-danger" onclick="document.getElementById('modalDetalleCliente').classList.remove('active')" style="margin-top:1rem;"><i class="fas fa-times"></i> Cerrar</button>
        </div>
    </div>

    <div id="modalBoleta" class="modal-boleta" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content">
            <h3 style="color:#1d5a7a;margin-bottom:1rem;"><i class="fas fa-file-invoice"></i> Boleta de pago</h3>
            <div id="boletaContenido"></div>
            <button class="btn btn-danger" onclick="document.getElementById('modalBoleta').classList.remove('active')" style="margin-top:1rem;"><i class="fas fa-times"></i> Cerrar</button>
        </div>
    </div>

    <div id="modalDeudores" class="modal-boleta" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content" style="max-width:900px;">
            <h3 style="color:#c0392b;margin-bottom:1rem;"><i class="fas fa-exclamation-triangle"></i> Clientes con meses adeudados</h3>
            <div id="modalDeudoresContenido"></div>
            <button class="btn btn-danger" onclick="document.getElementById('modalDeudores').classList.remove('active')" style="margin-top:1rem;"><i class="fas fa-times"></i> Cerrar</button>
        </div>
    </div>

    <div id="modalMemoria" class="modal-boleta" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content" style="max-width:800px;">
            <h3 style="color:#1d5a7a;margin-bottom:1rem;"><i class="fas fa-database"></i> Datos en localStorage</h3>
            <div id="contenidoMemoria" style="max-height:60vh;overflow-y:auto;"></div>
            <button class="btn btn-danger" onclick="document.getElementById('modalMemoria').classList.remove('active')" style="margin-top:1rem;"><i class="fas fa-times"></i> Cerrar</button>
        </div>
    </div>

    <!-- ✅ MODAL DETALLE DE PLAN (NUEVO) -->
    <div id="modalPlan" class="modal-plan" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content">
            <button class="close-modal" onclick="document.getElementById('modalPlan').classList.remove('active')">&times;</button>
            <div id="modalPlanContenido"></div>
        </div>
    </div>

        <!-- ✅ MODAL EDITAR CLIENTE (NUEVO) -->
    <div id="modalEditarCliente" class="modal-editar-cliente" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content">
            <button class="close-modal" onclick="document.getElementById('modalEditarCliente').classList.remove('active')">&times;</button>
            <h3><i class="fas fa-user-edit"></i> Editar Cliente</h3>
            <div id="modalEditarClienteContenido"></div>
        </div>
    </div>

    <!-- ✅ MODAL BOLETA CLIENTE (NUEVO) -->
    <div id="modalBoletaCliente" class="modal-boleta-cliente" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content">
            <button class="close-modal" onclick="document.getElementById('modalBoletaCliente').classList.remove('active')" 
                    style="position:absolute;top:1rem;right:1rem;background:#e74c3c;color:white;border:none;width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;z-index:10;">&times;</button>
            <div id="modalBoletaClienteContenido"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
